name: Installer tests

on:
  push:
    paths:
      - "installer/**"
      - ".config/GIMP/3.0/**"
      - ".local/**"
      - ".gitattributes"
      - "README.md"
      - ".github/workflows/installer-tests.yml"
  pull_request:
    paths:
      - "installer/**"
      - ".config/GIMP/3.0/**"
      - ".local/**"
      - ".gitattributes"
      - "README.md"
      - ".github/workflows/installer-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile installer
        run: python -m py_compile installer/photogimp_install.py
      - name: Run safety tests
        run: python -m unittest discover -s installer/tests -p "test_*.py" -v
      - name: Validate release inventory
        run: python installer/package_release.py --check
      - name: Build and verify release archive
        run: python installer/package_release.py --output photogimp-installer-ci.zip
